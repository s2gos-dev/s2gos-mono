site_name: DTE-S2GOS
site_description: Synthetic scene generation and observation simulation for Earth observation.

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite

plugins:
  - search
  - monorepo
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/s2gos-utils/src
            - packages/s2gos-generator/src
            - packages/s2gos-simulator/src
            - packages/s2gos-apps/src
          options:
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            group_by_category: true
            show_category_heading: true
            show_attributes: true
            extensions:
              - griffe_pydantic

nav:
  - Home: index.md
  - Examples:
    - HYPSTAR Gobabeb: hypstar_simulations.md
  - Packages:
    - Generator:  "!include ./packages/s2gos-generator/mkdocs.yml"
    - Simulator:  "!include ./packages/s2gos-simulator/mkdocs.yml"
    - Utils:      "!include ./packages/s2gos-utils/mkdocs.yml"
    - Apps:       "!include ./packages/s2gos-apps/mkdocs.yml"
