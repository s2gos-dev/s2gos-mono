[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
    { name = "Misael Gonzalez (Rayference)" },
    { name = "Nicolae Marton (Rayference)" },
]
description = "Common shared components for the ESA DTE-S2GOS service (scene descriptions, materials, I/O utilities)."
name = "s2gos-utils"
requires-python = ">=3.10,<3.12"
version = "0.2.0"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "numpy>=1.24,<2",
    "fsspec",
    "pandas",
    "xarray",
    "geopandas",
    "pyarrow",
    "attrs",
    "universal-pathlib",
    "dynaconf>=3",
]

[dependency-groups]
test = ["pytest"]
dev = ["jupyter", "jupyterlab>=4", "ipykernel"]
docs = ["mkdocs", "mkdocs-material>=9"]

# ── pixi ─────────────────────────────────────────────────────
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.12"
dynaconf = "*"
s3fs = "*"

[tool.pixi.pypi-dependencies]
s2gos_utils = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
jupyter = "*"
jupyterlab = ">=4"
ipykernel = "*"
ruff = "*"

[tool.pixi.tasks]
notebook = "jupyter notebook"
lab = "jupyter lab"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
dev = { features = ["dev", "test", "docs"], solve-group = "default" }

# ── tools ────────────────────────────────────────────────────
[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = "tests"

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
ignore = ["E501", "F821"]
isort = { relative-imports-order = "closest-to-furthest" }
per-file-ignores = { "*.ipynb" = ["E402"] }
select = ["I", "F", "E"]
