[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
    { name = "Misael Gonzalez (Rayference)" },
    { name = "Nicolae Marton (Rayference)" },
]
description = "Synthetic scene generator for the ESA DTE-S2GOS service."
name = "s2gos-generator"
requires-python = ">=3.10,<3.12"
version = "0.1.0"
dependencies = [
    "s2gos-utils",
    "geopandas",
    "xarray",
    "xarray-regrid",
    "pyproj",
    "shapely>=2",
    "trimesh",
    "numpy>=1.24,<2",
    "pillow",
    "pyarrow",
    "rasterio",
    "rioxarray",
    "pyyaml",
    "zarr<3",
    "dask",
    "sf-hamilton>=1.78",
    "psutil",
    "graphviz",
    "scipy",
]

[dependency-groups]
test = ["pytest"]
dev = ["jupyter", "jupyterlab>=4", "ipykernel"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9",
    "mkdocstrings[python]",
    "griffe-pydantic",
]

# ── pixi ─────────────────────────────────────────────────────
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.12"

[tool.pixi.pypi-dependencies]
s2gos_generator = { path = ".", editable = true }
s2gos_utils = { path = "../s2gos-utils", editable = true }

[tool.pixi.tasks]
notebook = "jupyter notebook"
lab = "jupyter lab"

[tool.pixi.feature.docs.tasks]
docs-build = "mkdocs build"
docs-serve = "mkdocs serve"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
dev = { features = ["dev", "test", "docs"], solve-group = "default" }

# ── tools ────────────────────────────────────────────────────
[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = "tests"

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
ignore = ["E501", "F821"]
isort = { relative-imports-order = "closest-to-furthest" }
per-file-ignores = { "*.ipynb" = ["E402"] }
select = ["I", "F", "E"]
