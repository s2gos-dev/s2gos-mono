site_name: s2gos-generator

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            group_by_category: true
            show_category_heading: true
            show_attributes: true
            extensions:
              - griffe_pydantic

nav:
  - Introduction: index.md
  - Concepts: concepts.md
  - Configuration: configuration.md
  - Setup: setup.md
  - Examples:
    - Gobabeb Quickstart: examples/gobabeb_quickstart.md
  - API Reference:
    - Configuration:
      - Scene: api/scene_config.md
      - Atmosphere: api/atmosphere.md
      - Buildings & Roads: api/buildings_roads.md
      - Vegetation: api/vegetation.md
      - Assets & Regions: api/assets.md
      - Adaptive Mesh: api/mesh_refinement.md
      - Spectral Matching: api/spectral_matching.md
    - Pipeline & Core:
      - Pipeline: api/pipeline.md
      - Exceptions: api/exceptions.md
    - Processors:
      - Spectral: api/processors_spectral.md
      - Roads: api/processors_roads.md
      - Texture: api/processors_texture.md
      - Snow: api/processors_snow.md
      - Terrain Data: api/processors_terrain_data.md
      - Terrain Mesh: api/processors_terrain_mesh.md
      - Buildings: api/processors_buildings.md
      - Vegetation: api/processors_vegetation.md
    - Datasets: api/datasets.md
  - Changelog: changelog.md
