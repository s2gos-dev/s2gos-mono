[project]
name = "s2gos-apps"
version = "0.0.1"
description = "S2GOS application processes and multi-temporal radiometric demonstration workflows."
authors = [
    { name = "Misael Gonzalez (Rayference)" },
    { name = "Nicolae Marton (Rayference)" },
]
requires-python = ">=3.10,<3.12"
dependencies = [
    "s2gos-utils",
    "s2gos-generator",
    "s2gos-simulator",
    "ipyleaflet",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project.optional-dependencies]
test = ["pytest"]
dev  = ["jupyterlab>=4", "ipykernel>=6"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
s2gos_apps      = { path = ".",               editable = true }
s2gos_utils     = { path = "../s2gos-utils",     editable = true }
s2gos_generator = { path = "../s2gos-generator", editable = true }
s2gos_simulator = { path = "../s2gos-simulator", editable = true }


[tool.pixi.environments]
default = { solve-group = "default" }
test    = { features = ["test"], solve-group = "default" }
dev     = { features = ["dev"], solve-group = "default" }

[project.scripts]
s2gos_apps = "s2gos_apps.cli:cli"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = "tests"

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
ignore = ["E501", "F821"]
select = ["I", "F", "E"]

[tool.ruff.lint.isort]
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
