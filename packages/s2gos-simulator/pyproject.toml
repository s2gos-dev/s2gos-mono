[project]
authors = [
    { name = "Misael Gonzalez (Rayference)" },
    { name = "Nicolae Marton (Rayference)" },
]
description = "Observation simulator for the ESA DTE-S2GOS synthetic scene generator service."
name = "s2gos-simulator"
requires-python = ">=3.10,<3.12"
version = "0.0.1"
dependencies = [
    "s2gos-utils",
    "eradiate[kernel]==1.0.1",
    "pydantic>=2",
    "pyyaml",
    "numpy<2",
    "pillow",
    "xarray<2025",
    "zarr<3",
    "skyfield",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9", "mkdocstrings[python]", "griffe-pydantic"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
s2gos_simulator = { path = ".", editable = true }

[tool.pixi.feature.test.tasks]
test = "pytest"

[tool.pixi.feature.docs.tasks]
docs-build = "mkdocs build"
docs-serve = "mkdocs serve"

[tool.pixi.environments]
default = { solve-group = "default" }
test    = { features = ["test"], solve-group = "default" }
dev     = { features = ["docs"], solve-group = "default" }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = "tests"

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
ignore = ["E501", "F821"]
isort = { relative-imports-order = "closest-to-furthest" }
per-file-ignores = { "*.ipynb" = ["E402"] }
select = ["I", "F", "E"]
