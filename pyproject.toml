[project]
name = "s2gos-mono"
version = "0.0.1"
description = "S2GOS monorepo: synthetic scene generation and observation simulation."
authors = [
    { name = "Misael Gonzalez (Rayference)" },
    { name = "Nicolae Marton (Rayference)" },
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

# ── prod (default) — runtime + Jupyter, no dev tooling ─────────────
[tool.pixi.dependencies]
python = ">=3.10,<3.12"
jupyterlab = ">=4"
numpy = "<2"
s3fs = "*"
dask = "*"
xarray = "<2025"
zarr = "<3"

[tool.pixi.pypi-dependencies]
# Runtime framework (OGC-API, service, config)
click = "*"
fastapi = "*"
pydantic = "*"
pydantic-settings = "*"
pyyaml = "*"
typer = "*"
uvicorn = "*"
coverage = "*"
ipyleaflet = "*"    # required by s2gos-apps
# Monorepo packages — editable installs
s2gos_utils     = { path = "packages/s2gos-utils",     editable = true }
s2gos_generator = { path = "packages/s2gos-generator", editable = true }
s2gos_simulator = { path = "packages/s2gos-simulator", editable = true }
s2gos_apps      = { path = "packages/s2gos-apps",      editable = true }
# ── notebook feature — interactive widget support ───────────────────
[tool.pixi.feature.notebook.pypi-dependencies]
ipywidgets = "*"

# ── remote-controller — s2gos-controller from GitHub (default solve) ─
[tool.pixi.feature.remote-controller.pypi-dependencies]
s2gos-client = { git = "https://github.com/s2gos-dev/s2gos-controller.git", subdirectory = "s2gos-client" }
s2gos-server = { git = "https://github.com/s2gos-dev/s2gos-controller.git", subdirectory = "s2gos-server" }

# ── local-eozilla — swap GitHub sources for local sibling repos ──────
# Use:  pixi install -e local   or   pixi install -e dev-local
[tool.pixi.feature.local-eozilla.pypi-dependencies]
appligator   = { path = "../eozilla/appligator",                 editable = true }
cuiman       = { path = "../eozilla/cuiman",                     editable = true }
gavicore     = { path = "../eozilla/gavicore",                   editable = true }
procodile    = { path = "../eozilla/procodile",                  editable = true }
wraptile     = { path = "../eozilla/wraptile",                   editable = true }
s2gos-client = { path = "../s2gos-controller/s2gos-client",     editable = true }
s2gos-server = { path = "../s2gos-controller/s2gos-server",     editable = true }

# ── dev — adds testing, linting, docs, memory profiling ────────────
[tool.pixi.feature.dev.dependencies]
pytest      = "*"
ruff        = "*"
ipython     = "*"
ipykernel   = "*"
snakeviz    = "*"
mkdocs                  = "*"
mkdocs-monorepo-plugin  = "*"
mkdocs-material         = "*"
mkdocstrings            = "*"
mkdocstrings-python     = "*"

[tool.pixi.feature.dev.pypi-dependencies]
memray         = "*"
griffe-pydantic = "*"

# ── environments ────────────────────────────────────────────────────
[tool.pixi.environments]
default  = { features = ["remote-controller"],                    solve-group = "default" }
notebook = { features = ["remote-controller", "notebook"],        solve-group = "default" }
dev      = { features = ["remote-controller", "dev"],             solve-group = "default" }

# ── tasks ───────────────────────────────────────────────────────────
[tool.pixi.tasks]
lab           = "jupyter lab"
eradiate-init = "eradiate data install core gecko"

[tool.pixi.feature.dev.tasks]
test       = "pytest"
lint       = "ruff check ."
format     = "ruff format ."
docs        = "mkdocs serve"
docs-build  = "mkdocs build"
docs-deploy = "mkdocs gh-deploy --force"

[project.scripts]
s2gos_apps = "s2gos_apps.cli:cli"

[tool.pytest.ini_options]
testpaths = [
    "packages/s2gos-utils/tests",
    "packages/s2gos-generator/tests",
    "packages/s2gos-simulator/tests",
    "packages/s2gos-apps/tests",
]

[tool.ruff]
include = ["pyproject.toml", "packages/*/src/**/*.py", "packages/*/tests/**/*.py"]

[tool.ruff.lint]
ignore = ["E501", "F821"]
select = ["I", "F", "E"]

[tool.ruff.lint.isort]
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
