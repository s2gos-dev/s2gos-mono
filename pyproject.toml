[project]
name = "s2gos-mono"
version = "0.0.1"
description = "S2GOS monorepo: synthetic scene generation and observation simulation."
authors = [
    { name = "Misael Gonzalez (Rayference)" },
    { name = "Nicolae Marton (Rayference)" },
]

# ── workspace ─────────────────────────────────────────────────
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

# ── base runtime deps (all environments) ──────────────────────
[tool.pixi.dependencies]
python = ">=3.10,<3.12"
numpy = "<2"
s3fs = "*"
dask = "*"
xarray = "<2025"
zarr = "<3"

[tool.pixi.pypi-dependencies]
pydantic = "*"
pyyaml = "*"
s2gos_utils     = { path = "packages/s2gos-utils",      editable = true }
s2gos_generator = { path = "packages/s2gos-generator",  editable = true }
s2gos_simulator = { path = "packages/s2gos-simulator",  editable = true }
s2gos_apps      = { path = "packages/s2gos-apps",       editable = true }

# ── feature: notebook ─────────────────────────────────────────
[tool.pixi.feature.notebook.dependencies]
jupyterlab = ">=4"
ipykernel = "*"

[tool.pixi.feature.notebook.pypi-dependencies]
ipywidgets = "*"
ipyleaflet = "*"

# ── feature: controller (from GitHub) ─────────────────────────
[tool.pixi.feature.controller.pypi-dependencies]
s2gos-client = { git = "https://github.com/s2gos-dev/s2gos-controller.git", subdirectory = "s2gos-client" }
s2gos-server = { git = "https://github.com/s2gos-dev/s2gos-controller.git", subdirectory = "s2gos-server" }

# ── feature: local-deps (local eozilla + controller repos) ────
[tool.pixi.feature.local-deps.pypi-dependencies]
appligator   = { path = "../eozilla/appligator",             editable = true }
cuiman       = { path = "../eozilla/cuiman",                 editable = true }
gavicore     = { path = "../eozilla/gavicore",               editable = true }
procodile    = { path = "../eozilla/procodile",              editable = true }
wraptile     = { path = "../eozilla/wraptile",               editable = true }
s2gos-client = { path = "../s2gos-controller/s2gos-client", editable = true }
s2gos-server = { path = "../s2gos-controller/s2gos-server", editable = true }

# ── feature: test ─────────────────────────────────────────────
[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.feature.test.pypi-dependencies]
coverage = "*"

# ── feature: docs ─────────────────────────────────────────────
[tool.pixi.feature.docs.dependencies]
mkdocs                  = "*"
mkdocs-monorepo-plugin  = "*"
mkdocs-material         = "*"
mkdocstrings            = "*"
mkdocstrings-python     = "*"

[tool.pixi.feature.docs.pypi-dependencies]
griffe-pydantic = "*"

# ── feature: dev-tools ────────────────────────────────────────
[tool.pixi.feature.dev-tools.dependencies]
ruff       = "*"
pre-commit = "*"
ipython    = "*"
ipykernel  = "*"

[tool.pixi.feature.dev-tools.pypi-dependencies]
memray   = "*"
snakeviz = "*"

# ── environments ──────────────────────────────────────────────
[tool.pixi.environments]
default   = { solve-group = "default" }
test      = { features = ["test"], solve-group = "default" }
dev       = { features = ["notebook", "controller", "test", "docs", "dev-tools"], solve-group = "default" }
dev-local = { features = ["notebook", "local-deps", "test", "docs", "dev-tools"], solve-group = "local" }

# ── tasks ─────────────────────────────────────────────────────
[tool.pixi.tasks]
lab           = "jupyter lab"
eradiate-init = "eradiate data install core gecko"

[tool.pixi.feature.dev-tools.tasks]
lint              = "ruff check ."
format            = "ruff format ."
pre-commit-install = "pre-commit install"

[tool.pixi.feature.test.tasks]
test       = "pytest"

[tool.pixi.feature.docs.tasks]
docs        = "mkdocs serve"
docs-build  = "mkdocs build"
docs-deploy = "mkdocs gh-deploy --force"

[project.scripts]
s2gos_apps = "s2gos_apps.cli:cli"

[tool.pytest.ini_options]
testpaths = [
    "packages/s2gos-utils/tests",
    "packages/s2gos-generator/tests",
    "packages/s2gos-simulator/tests",
    "packages/s2gos-apps/tests",
]

[tool.ruff]
include = ["pyproject.toml", "packages/*/src/**/*.py", "packages/*/tests/**/*.py"]

[tool.ruff.lint]
ignore = ["E501", "F821"]
select = ["I", "F", "E"]
